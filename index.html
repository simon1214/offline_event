  <!-- ═══ 게임 전용 스타일 (iOS용 시스템 폰트 fallback) ═══ -->
  <style>
    /* iOS Safari: 시스템 폰트 우선 (한글: Apple SD Gothic Neo) */
    body, button, input {
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard Variable', Pretendard, system-ui, sans-serif;
    }


    
    * { -webkit-tap-highlight-color: transparent; font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, sans-serif; }
    html, body, #root { height: 100%; margin: 0; }
    body { overscroll-behavior: none; background: #0A0A0A; touch-action: manipulation; }
    button { touch-action: manipulation; }

    /* 모바일 프레임: 데스크톱에서는 폰 프리뷰 모드, 모바일 디바이스에서는 풀스크린 */
    .gc-mobile-frame {
      width: min(100vw, 430px);
      height: min(100vh, 100dvh);
      max-height: 932px;
      aspect-ratio: 430 / 932;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    }
    @media (max-width: 480px) {
      .gc-mobile-frame {
        width: 100vw;
        height: 100vh;
        height: 100dvh; /* iOS Safari 주소창 변동 대응 */
        max-height: none;
        aspect-ratio: auto;
        box-shadow: none;
      }
    }

    /* LG 그램케어 앰블럼 — fly-in & settle 애니메이션 */
    .gc-emblem {
      transform: translate(150%, -50%) scale(0.5) rotate(28deg);
      opacity: 0;
      filter: drop-shadow(0 12px 24px rgba(165,0,52,0.35));
      transition: transform 1400ms cubic-bezier(0.34, 1.56, 0.64, 1), opacity 1000ms ease-out;
      will-change: transform, opacity;
    }
    .gc-emblem-active {
      transform: translate(-50%, -50%) scale(1) rotate(-6deg);
      opacity: 1;
      animation: gc-emblem-impact 1400ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .gc-emblem-settle {
      animation: gc-emblem-pulse 2000ms ease-in-out infinite;
    }
    @keyframes gc-emblem-impact {
      0%   { transform: translate(150%, -50%) scale(0.5) rotate(28deg); opacity: 0; }
      60%  { transform: translate(-50%, -50%) scale(1.18) rotate(-10deg); opacity: 1; }
      80%  { transform: translate(-50%, -50%) scale(0.94) rotate(-4deg); }
      100% { transform: translate(-50%, -50%) scale(1) rotate(-6deg); opacity: 1; }
    }
    @keyframes gc-emblem-pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1) rotate(-6deg); filter: drop-shadow(0 12px 24px rgba(165,0,52,0.35)); }
      50%      { transform: translate(-50%, -50%) scale(1.05) rotate(-6deg); filter: drop-shadow(0 18px 36px rgba(165,0,52,0.55)); }
    }

    /* 잔여 수량 긴급 상태 (10잔 이하) — 미세한 펄스로 주목성 강화 */
    .gc-urgent-pulse {
      animation: gc-urgent-blink 1.6s ease-in-out infinite;
    }
    @keyframes gc-urgent-blink {
      0%, 100% { filter: brightness(1); }
      50%      { filter: brightness(1.18); }
    }
    
  </style>
