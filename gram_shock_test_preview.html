<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>그램 충격 테스트 — 에브리유니즈 × LG 그램</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/[email protected]/dist/web/variable/pretendardvariable.css');
    * { -webkit-tap-highlight-color: transparent; font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, sans-serif; }
    html, body, #root { height: 100%; margin: 0; }
    body { overscroll-behavior: none; background: #0A0A0A; touch-action: manipulation; }
    button { touch-action: manipulation; }

    /* 모바일 프레임: 데스크톱에서는 폰 프리뷰 모드, 모바일 디바이스에서는 풀스크린 */
    .gc-mobile-frame {
      width: min(100vw, 430px);
      height: min(100vh, 100dvh);
      max-height: 932px;
      aspect-ratio: 430 / 932;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    }
    @media (max-width: 480px) {
      .gc-mobile-frame {
        width: 100vw;
        height: 100vh;
        height: 100dvh; /* iOS Safari 주소창 변동 대응 */
        max-height: none;
        aspect-ratio: auto;
        box-shadow: none;
      }
    }

    /* LG 그램케어 앰블럼 — fly-in & settle 애니메이션 */
    .gc-emblem {
      transform: translate(150%, -50%) scale(0.5) rotate(28deg);
      opacity: 0;
      filter: drop-shadow(0 12px 24px rgba(165,0,52,0.35));
      transition: transform 1400ms cubic-bezier(0.34, 1.56, 0.64, 1), opacity 1000ms ease-out;
      will-change: transform, opacity;
    }
    .gc-emblem-active {
      transform: translate(-50%, -50%) scale(1) rotate(-6deg);
      opacity: 1;
      animation: gc-emblem-impact 1400ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .gc-emblem-settle {
      animation: gc-emblem-pulse 2000ms ease-in-out infinite;
    }
    @keyframes gc-emblem-impact {
      0%   { transform: translate(150%, -50%) scale(0.5) rotate(28deg); opacity: 0; }
      60%  { transform: translate(-50%, -50%) scale(1.18) rotate(-10deg); opacity: 1; }
      80%  { transform: translate(-50%, -50%) scale(0.94) rotate(-4deg); }
      100% { transform: translate(-50%, -50%) scale(1) rotate(-6deg); opacity: 1; }
    }
    @keyframes gc-emblem-pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1) rotate(-6deg); filter: drop-shadow(0 12px 24px rgba(165,0,52,0.35)); }
      50%      { transform: translate(-50%, -50%) scale(1.05) rotate(-6deg); filter: drop-shadow(0 18px 36px rgba(165,0,52,0.55)); }
    }

    /* 잔여 수량 긴급 상태 (10잔 이하) — 미세한 펄스로 주목성 강화 */
    .gc-urgent-pulse {
      animation: gc-urgent-blink 1.6s ease-in-out infinite;
    }
    @keyframes gc-urgent-blink {
      0%, 100% { filter: brightness(1); }
      50%      { filter: brightness(1.18); }
    }
  </style>
</head>

    /* ─── Nickname ─── */
    const NICK_ADJECTIVES = ['신선한','향긋한','부드러운','쫄깃한','바삭한','시원한','따뜻한','달콤한','매콤한','짭짤한','고소한','상큼한','촉촉한','진한','엄청난','특이한','감동적인','얼큰한','쌉쌀한','얼얼한'];
    const NICK_NOUNS = ['라떼','모카','아메리카노','카푸치노','에스프레소','마키아토','콜드브루','카페오레','카라멜','바닐라','플랫화이트','돌체','크루아상','베이글','머핀','스콘','쿠키','브라우니'];
    function generateNickname() {
      const a = NICK_ADJECTIVES[Math.floor(Math.random() * NICK_ADJECTIVES.length)];
      const n = NICK_NOUNS[Math.floor(Math.random() * NICK_NOUNS.length)];
      const num = Math.floor(Math.random() * 9000) + 1000;
      return `${a} ${n} ${num}`;
    }

    /* ─── Storage (localStorage, per-game-namespaced) ─── */
    const NS = 'shocktest_';
    /* 글로벌(앱 전역) 키: 현재 로그인된 회원번호 */
    const CURRENT_MEMBER_KEY = NS + 'current_member_id';
    const storage = {
      async get(key) { try { return localStorage.getItem(NS + key); } catch { return null; } },
      async set(key, value) { try { localStorage.setItem(NS + key, String(value)); } catch {} },
      async remove(key) { try { localStorage.removeItem(NS + key); } catch {} },
    };
    /* 회원번호별 스토리지 (실제 OAuth 연동 시에도 동일 인터페이스로 교체 가능) */
    function userStorage(memberId) {
      const prefix = `${NS}user_${memberId}_`;
      return {
        async get(key) { try { return localStorage.getItem(prefix + key); } catch { return null; } },
        async set(key, value) { try { localStorage.setItem(prefix + key, String(value)); } catch {} },
        async remove(key) { try { localStorage.removeItem(prefix + key); } catch {} },
      };
    }
    /* 데모용 회원번호 자동 발급 (실제 OAuth 시 에브리유니즈가 반환) */
    function generateMockMemberId() {
      return String(Math.floor(Math.random() * 900000) + 100000); // 6자리
    }

    /* ─── 커피 교환권 수량 제한 (선착순) ─── */
    /* 실제 운영 시 백엔드 카운터로 교체. 현재는 로컬에 누적되는 모의 카운터. */
    const TOTAL_COUPONS = 200;
    const GLOBAL_REDEEMED_KEY = NS + 'global_redeemed_count';
    const DEMO_INITIAL_REDEEMED = 127; // 데모용 초기값 (73잔 남은 상태로 시작)

    function getRedeemedCount() {
      try {
        const v = localStorage.getItem(GLOBAL_REDEEMED_KEY);
        if (v === null) {
          localStorage.setItem(GLOBAL_REDEEMED_KEY, String(DEMO_INITIAL_REDEEMED));
          return DEMO_INITIAL_REDEEMED;
        }
        return parseInt(v, 10) || 0;
      } catch { return DEMO_INITIAL_REDEEMED; }
    }
    function persistRedeemedCount(n) {
      try { localStorage.setItem(GLOBAL_REDEEMED_KEY, String(Math.max(0, n))); } catch {}
    }

    /* ─── Analytics (모의 트래킹 레이어 — 실제 GA4/Mixpanel/자체 BE로 교체 가능) ─── */
    /* 인터페이스만 추상화. 실제 서비스 붙일 땐 track() 내부만 교체. */
    const MAX_EVENT_LOG = 100;
    const analytics = {
      async track(eventName, properties = {}) {
        try {
          const memberId = localStorage.getItem(CURRENT_MEMBER_KEY);
          const event = {
            eventName,
            memberId: memberId || null,
            timestamp: Date.now(),
            ...properties,
          };
          // 1) 개발자용 콘솔
          console.log('[Analytics]', event);
          // 2) 로컬 이벤트 로그 (회원별, 최근 100개)
          if (memberId) {
            const us = userStorage(memberId);
            const raw = await us.get('events');
            const arr = raw ? JSON.parse(raw) : [];
            arr.push(event);
            const trimmed = arr.slice(-MAX_EVENT_LOG);
            await us.set('events', JSON.stringify(trimmed));
          }
          // 3) TODO: 실제 분석 서비스로 전송
          // await fetch('/api/events', { method: 'POST', body: JSON.stringify(event) });
        } catch (e) { /* swallow */ }
      },
    };

    /* ─── Share (Web Share API + 클립보드 폴백) ─── */
    /* 호출처별로 location 메타데이터 전달. 결과 모달 등에서는 score 등 컨텍스트 추가 가능. */
    const buildShareData = (context = {}) => {
      if (context.score) {
        return {
          title: '에브리유니즈 × LG 그램 이벤트',
          text: `내 점수 ${context.score.toLocaleString()}pt 달성! 너도 한번 해봐 — 미니게임 도전하고 커피 교환권 받기`,
          url: EVENT_URL,
        };
      }
      return {
        title: '에브리유니즈 × LG 그램 이벤트',
        text: 'LG 그램케어 없이 그램이 버틸 수 있을까? 미니게임 도전하고 커피 받자!',
        url: EVENT_URL,
      };
    };
    // 반환값: 'shared' | 'copied' | 'cancelled' | 'failed'
    async function shareEvent(location, context = {}) {
      const data = buildShareData(context);
      analytics.track('share_clicked', { location, ...(context.score ? { score: context.score } : {}) });
      // Web Share API 시도
      if (typeof navigator !== 'undefined' && navigator.share) {
        try {
          await navigator.share(data);
          analytics.track('share_completed', { location });
          return 'shared';
        } catch (err) {
          if (err && err.name === 'AbortError') {
            analytics.track('share_cancelled', { location });
            return 'cancelled';
          }
          // 그 외 에러는 클립보드 폴백으로
        }
      }
      // 폴백: 클립보드에 텍스트+링크 복사
      const fallbackText = `${data.text}\n${data.url}`;
      try {
        if (typeof navigator !== 'undefined' && navigator.clipboard) {
          await navigator.clipboard.writeText(fallbackText);
          analytics.track('share_copied', { location });
          return 'copied';
        }
      } catch {}
      return 'failed';

    /* ─── GAME — Shock Test ─── */
    function GameScreen({ onComplete, onAbandoned, bestScore, onCompletion }) {
      const [phase, setPhase] = useState('ready'); // 'ready' → 'playing' → 'finished'
      const [countdown, setCountdown] = useState(3);
      const [gauge, setGauge] = useState(0);
      const [taps, setTaps] = useState(0);
      const [elapsedMs, setElapsedMs] = useState(0);
      const [showResults, setShowResults] = useState(false);
      const [healPhase, setHealPhase] = useState('none'); // 'none' → 'incoming' → 'healing' → 'healed'
      const [shareToast, setShareToast] = useState('');

      // Refs for stable handlers
      const phaseRef = useRef(phase);
      const lastInputRef = useRef(null);
      const lastTapTimeRef = useRef(0);
      const startTimeRef = useRef(0);
      const finishTimeRef = useRef(0);
      const canvasRef = useRef(null);
      const containerRef = useRef(null);
      const gaugeRef = useRef(0);
      const cracksRef = useRef([]);
      const dentsRef = useRef([]);
      const healFactorRef = useRef(1); // 1 = full damage, 0 = fully healed (점진 감소)
      const sparksRef = useRef([]);
      const nextExpectedRef = useRef('left'); // alternation cue

      const [nextExpected, setNextExpected] = useState('left');

      useEffect(() => { phaseRef.current = phase; }, [phase]);
      useEffect(() => { gaugeRef.current = gauge; }, [gauge]);

      // Ready countdown
      useEffect(() => {
        if (phase !== 'ready') return;
        if (countdown <= 0) {
          setPhase('playing');
          startTimeRef.current = performance.now();
          return;
        }
        const t = setTimeout(() => setCountdown(c => c - 1), 750);
        return () => clearTimeout(t);
      }, [phase, countdown]);

      // Elapsed-time loop while playing
      useEffect(() => {
        if (phase !== 'playing') return;
        let raf;
        const loop = () => {
          setElapsedMs(performance.now() - startTimeRef.current);
          raf = requestAnimationFrame(loop);
        };
        raf = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(raf);
      }, [phase]);

      // Game-finish heal sequence: 부서진 그램 노출 → 앰블럼 우측에서 진입 → heal 진행 → 결과 모달
      // (시간을 두 배로 늘려 복구 모먼트를 충분히 보여줌)
      useEffect(() => {
        if (phase !== 'finished') return;
        const timers = [];
        // t=1000ms: 앰블럼 진입 시작 (부서진 상태를 잠시 더 보여주고)
        timers.push(setTimeout(() => setHealPhase('incoming'), 1000));
        // t=2400ms: 앰블럼이 화면 중앙 도착 → heal 시작 (healFactor 점진 감소)
        timers.push(setTimeout(() => {
          setHealPhase('healing');
          const healStart = performance.now();
          const HEAL_DURATION = 1400; // ms (기존 700ms의 2배)
          const animate = () => {
            const t = Math.min(1, (performance.now() - healStart) / HEAL_DURATION);
            // ease-out cubic
            const eased = 1 - Math.pow(1 - t, 3);
            healFactorRef.current = 1 - eased;
            if (t < 1) requestAnimationFrame(animate);
            else { healFactorRef.current = 0; setHealPhase('healed'); }
          };
          requestAnimationFrame(animate);
        }, 2400));
        // t=4800ms: 결과 모달 노출 (healed 상태를 길게 보여줌)
        timers.push(setTimeout(() => setShowResults(true), 4800));
        return () => { timers.forEach(clearTimeout); };
      }, [phase]);

      // Stable input handler
      const handleInput = useCallback((direction) => {
        if (phaseRef.current !== 'playing') return;
        if (lastInputRef.current === direction) return; // must alternate

        lastInputRef.current = direction;
        lastTapTimeRef.current = performance.now();
        nextExpectedRef.current = direction === 'left' ? 'right' : 'left';
        setNextExpected(nextExpectedRef.current);
        setTaps(t => t + 1);

        // Update gauge
        setGauge(g => {
          const newG = Math.min(100, g + GAUGE_PER_TAP);
          // Add damage features at this tap
          addDamageFeature(newG);
          if (newG >= 100) {
            finishTimeRef.current = performance.now() - startTimeRef.current;
            // Add bonus damage flourish
            for (let i = 0; i < 5; i++) addDamageFeature(100);
            setPhase('finished');
          }
          return newG;
        });

        // Spawn impact spark
        sparksRef.current.push({
          x: (Math.random() - 0.5) * 60,
          y: (Math.random() - 0.5) * 40,
          vx: (Math.random() - 0.5) * 4,
          vy: -1 - Math.random() * 3,
          life: 30 + Math.random() * 20,
          maxLife: 50,
        });
      }, []);

      const addDamageFeature = (gaugeLevel) => {
        // Generate a stable crack
        const startX = (Math.random() - 0.5) * 0.8;
        const startY = (Math.random() - 0.5) * 0.7;
        const segments = [];
        let curAngle = Math.random() * Math.PI * 2;
        let cx = startX, cy = startY;
        const segCount = 2 + Math.floor(Math.random() * 3);
        for (let i = 0; i < segCount; i++) {
          curAngle += (Math.random() - 0.5) * 1.2;
          const segLen = 0.08 + Math.random() * 0.15;
          cx += Math.cos(curAngle) * segLen;
          cy += Math.sin(curAngle) * segLen;
          segments.push({ x: cx, y: cy });
        }
        cracksRef.current.push({ startX, startY, segments, intensity: 0.4 + Math.random() * 0.6 });

        // Sometimes add a body dent (around edges)
        if (gaugeLevel > 50 && Math.random() < 0.4) {
          const angle = Math.random() * Math.PI * 2;
          dentsRef.current.push({
            x: Math.cos(angle) * (0.45 + Math.random() * 0.1),
            y: Math.sin(angle) * (0.35 + Math.random() * 0.1),
            size: 0.04 + Math.random() * 0.04,
            angle,
          });
        }
      };

      // Keyboard bindings
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
            e.preventDefault();
            handleInput('left');
          } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
            e.preventDefault();
            handleInput('right');
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [handleInput]);

      // Canvas resize + drawing loop
      useEffect(() => {
        const setupSize = () => {
          const c = canvasRef.current;
          const wrap = containerRef.current;
          if (!c || !wrap) return;
          const dpr = window.devicePixelRatio || 1;
          const w = wrap.clientWidth, h = wrap.clientHeight;
          c.width = w * dpr; c.height = h * dpr;
          c.style.width = w + 'px'; c.style.height = h + 'px';
          c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
        };
        setupSize();
        window.addEventListener('resize', setupSize);

        let raf;
        const draw = () => {
          const c = canvasRef.current;
          const wrap = containerRef.current;
          if (!c || !wrap) { raf = requestAnimationFrame(draw); return; }
          const ctx = c.getContext('2d');
          const W = wrap.clientWidth, H = wrap.clientHeight;
          // healFactor를 gauge에 곱해 damage 시각효과를 점진적으로 사라지게.
          // healFactor가 0.5 이하면 균열/덴트도 비워 깨끗한 그램 그리기.
          const hf = healFactorRef.current;
          const visibleCracks = hf > 0.5 ? cracksRef.current : [];
          const visibleDents = hf > 0.5 ? dentsRef.current : [];
          const visibleSparks = hf > 0.7 ? sparksRef.current : [];
          drawScene(ctx, W, H, gaugeRef.current * hf, visibleCracks, visibleDents, visibleSparks, lastTapTimeRef.current, phaseRef.current);
          raf = requestAnimationFrame(draw);
        };
        raf = requestAnimationFrame(draw);

        return () => {
          window.removeEventListener('resize', setupSize);
          cancelAnimationFrame(raf);
        };
      }, []);

      const score = useMemo(() => calcScore(finishTimeRef.current), [showResults]);
      const finishTime = useMemo(() => finishTimeRef.current / 1000, [showResults]);

      return (
        <ScreenFrame bg="#F5F5F7">
          <div className="flex flex-col h-full">
            {/* HUD */}
            <div className="flex items-center justify-between px-4 h-14 relative z-10"
                 style={{ background: 'rgba(255,255,255,0.92)', backdropFilter: 'blur(12px)', borderBottom: `1px solid ${T.borderSubtle}` }}>
              <button onClick={() => onAbandoned({ phase, gauge: Math.round(gauge), taps, elapsedMs })}
                      className="w-9 h-9 -ml-2 flex items-center justify-center rounded-full hover:bg-black/5 active:scale-95 transition-all"
                      style={{ color: T.textPrimary }}>
                <ArrowLeft size={20} strokeWidth={2} />
              </button>
              <div className="flex items-center gap-3">
                <div className="flex items-baseline gap-1.5">
                  <Timer size={12} color={T.textMuted} strokeWidth={2.5} />
                  <span style={{ fontSize: '15px', color: T.textPrimary, fontWeight: 800, letterSpacing: '-0.02em' }}>
                    {(elapsedMs / 1000).toFixed(2)}<span style={{ fontSize: '11px', color: T.textMuted, fontWeight: 600 }}>s</span>
                  </span>
                </div>
                <div className="w-px h-4" style={{ background: T.border }} />
                <div className="flex items-baseline gap-1.5">
                  <Zap size={12} color={T.textMuted} strokeWidth={2.5} />
                  <span style={{ fontSize: '15px', color: T.textPrimary, fontWeight: 800, letterSpacing: '-0.02em' }}>
                    {taps}<span style={{ fontSize: '11px', color: T.textMuted, fontWeight: 600 }}> taps</span>
                  </span>
                </div>
              </div>
            </div>

            {/* Gauge */}
            <div className="px-4 pt-4 pb-3 relative z-10" style={{ background: 'rgba(255,255,255,0.6)', backdropFilter: 'blur(8px)' }}>
              <div className="flex items-center justify-between mb-1.5">
                <span style={{ fontSize: '11px', color: T.textMuted, fontWeight: 600, letterSpacing: '0.05em' }}>DAMAGE</span>
                <span style={{ fontSize: '12px', color: T.textPrimary, fontWeight: 700, letterSpacing: '-0.01em' }}>
                  {Math.round(gauge)}%
                </span>
              </div>
              <div className="h-2.5 rounded-full overflow-hidden" style={{ background: T.borderSubtle }}>
                <div className="h-full transition-all duration-75 relative"
                     style={{ width: `${gauge}%`, background: gauge > 70 ? T.lgRed : gauge > 40 ? '#F59E0B' : T.dark }}>
                  {gauge > 60 && (
                    <div className="absolute inset-0 opacity-50"
                         style={{ background: 'linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%)',
                                  animation: 'shimmer 1s linear infinite' }} />
                  )}
                </div>
              </div>
              <style>{`@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }`}</style>
            </div>

            {/* Laptop canvas area */}
            <div ref={containerRef} className="flex-1 relative">
              <canvas ref={canvasRef} className="absolute inset-0 w-full h-full" />

              {/* Phase overlays */}
              {phase === 'ready' && (
                <div className="absolute inset-0 flex flex-col items-center justify-center"
                     style={{ background: 'rgba(245, 245, 247, 0.85)', backdropFilter: 'blur(4px)' }}>
                  <div style={{ fontSize: '12px', color: T.textMuted, fontWeight: 600, letterSpacing: '0.1em' }}>READY</div>
                  <div className="mt-2" style={{
                    fontSize: '120px', fontWeight: 800, color: countdown > 0 ? T.textPrimary : T.lgRed,
                    letterSpacing: '-0.05em', lineHeight: 1,
                  }}>
                    {countdown > 0 ? countdown : 'GO'}
                  </div>
                  <div className="mt-4 text-[13px]" style={{ color: T.textSecondary }}>
                    좌우 버튼을 번갈아 빠르게!
                  </div>
                </div>
              )}

              {phase === 'finished' && !showResults && (
                <>
                  {/* LG 그램케어 앰블럼: 게임 종료 시 우측에서 진입 */}
                  <img src={EMBLEM_DATA_URL} alt="LG 그램케어 2년 보장"
                       className={`gc-emblem ${healPhase !== 'none' ? 'gc-emblem-active' : ''} ${healPhase === 'healing' || healPhase === 'healed' ? 'gc-emblem-settle' : ''}`}
                       style={{ position: 'absolute', top: '22%', left: '50%', width: '180px', height: 'auto', zIndex: 5, pointerEvents: 'none' }} />

                  <div className="absolute bottom-6 left-1/2 -translate-x-1/2 px-4 py-2 rounded-full pointer-events-none transition-all"
                       style={{
                         background: healPhase === 'healed' ? 'rgba(165,0,52,0.92)' : 'rgba(10,10,10,0.85)',
                         color: '#fff', fontSize: '12px', fontWeight: 700, letterSpacing: '-0.01em'
                       }}>
                    {healPhase === 'none' && '그램이 손상되었어요…'}
                    {healPhase === 'incoming' && 'LG 그램케어가 출동했어요'}
                    {healPhase === 'healing' && '그램을 안전하게 복구 중…'}
                    {healPhase === 'healed' && 'LG 그램케어로 안전하게 보호됐어요'}
                  </div>
                </>
              )}
            </div>

            {/* L/R buttons */}
            <div className="px-4 pb-6 pt-3" style={{ background: 'rgba(255,255,255,0.6)', backdropFilter: 'blur(8px)' }}>
              <div className="grid grid-cols-2 gap-3">
                <ActionButton
                  side="left"
                  expected={nextExpected === 'left'}
                  disabled={phase !== 'playing'}
                  onPress={() => handleInput('left')}
                />
                <ActionButton
                  side="right"
                  expected={nextExpected === 'right'}
                  disabled={phase !== 'playing'}
                  onPress={() => handleInput('right')}
                />
              </div>
            </div>

            {/* Results modal */}
            {showResults && (
              <div className="absolute inset-0 flex items-center justify-center px-6 z-30"
                   style={{ background: 'rgba(0,0,0,0.4)', backdropFilter: 'blur(8px)' }}>
                <div className="rounded-2xl w-full max-w-sm overflow-hidden"
                     style={{ background: T.surface, boxShadow: '0 20px 60px rgba(0,0,0,0.25)' }}>

                  {/* 상단: 시간 + 점수 (흰색) */}
                  <div className="px-6 pt-7 pb-6 text-center">
                    <div className="text-[11px]" style={{ color: T.textMuted, fontWeight: 600, letterSpacing: '0.06em' }}>YOUR TIME</div>
                    <div className="mt-1" style={{ fontSize: '48px', fontWeight: 800, color: T.textPrimary, letterSpacing: '-0.04em', lineHeight: 1 }}>
                      {finishTime.toFixed(2)}<span style={{ fontSize: '22px', color: T.textMuted, fontWeight: 700 }}>s</span>
                    </div>
                    <div className="mt-4 text-[11px]" style={{ color: T.textMuted, fontWeight: 600, letterSpacing: '0.06em' }}>SCORE</div>
                    <div className="mt-0.5" style={{ fontSize: '24px', fontWeight: 800, color: T.lgRed, letterSpacing: '-0.03em', lineHeight: 1 }}>
                      {score.toLocaleString()}<span style={{ fontSize: '13px', color: T.lgRed, marginLeft: '3px', fontWeight: 700 }}>pt</span>
                    </div>
                    {score > bestScore && (
                      <div className="mt-3 inline-flex items-center gap-1 text-[10.5px] px-2 py-1 rounded-md"
                           style={{ background: T.lgRedSubtle, color: T.lgRed, fontWeight: 700, letterSpacing: '-0.01em' }}>
                        <Check size={11} strokeWidth={2.6} /> 신기록 달성
                      </div>
                    )}
                  </div>

                  {/* 중간: 마케팅 메시지 (분홍 배경) */}
                  <div className="px-6 py-6 text-center" style={{ background: T.lgRedSubtle }}>
                    <div className="text-[13px]" style={{ color: T.textPrimary, fontWeight: 600, lineHeight: 1.55, letterSpacing: '-0.01em' }}>
                      LG 그램케어로 그램을 안전하게 지켜서<br/>
                      커피 교환권을 획득했어요!
                    </div>

                    <img src={LOGO_DATA_URL} alt="LG gram CARE G"
                         className="mt-4 mx-auto"
                         style={{ height: '24px', width: 'auto', display: 'block' }} />

                    <div className="mt-4 text-[12.5px]" style={{ color: T.textSecondary, letterSpacing: '-0.01em' }}>
                      에브리유니즈에서 LG 그램을 구매하면
                    </div>
                    <div className="mt-1.5" style={{ fontSize: '17px', color: T.lgRed, fontWeight: 800, letterSpacing: '-0.025em', lineHeight: 1.3 }}>
                      2년 보증 연장 LG 그램케어<br/>
                      무상 제공 (24만원 상당)
                    </div>
                    <div className="mt-3 text-[10.5px]" style={{ color: T.textMuted }}>
                      *자기부담금 25% 발생할 수 있음 (최저 3만원)
                    </div>
                  </div>

                  {/* 하단: CTA 버튼 (검정) + 공유 보조 액션 */}
                  <div className="px-5 py-5">
                    <button onClick={() => onComplete(score, { timeMs: elapsedMs, taps })}
                            className="w-full py-3.5 rounded-lg flex items-center justify-center gap-1.5 transition-all active:scale-[0.98]"
                            style={{ background: T.dark, color: '#fff', fontSize: '14px', fontWeight: 700, letterSpacing: '-0.01em' }}>
                      커피 교환하러 가기
                      <ChevronRight size={15} strokeWidth={2.6} />
                    </button>
                    <button onClick={async () => {
                              const result = await shareEvent('result_modal', { score });
                              if (result === 'copied') {
                                setShareToast('링크가 복사됐어요');
                                setTimeout(() => setShareToast(''), 1800);
                              } else if (result === 'shared') {
                                setShareToast('공유 완료');
                                setTimeout(() => setShareToast(''), 1500);
                              }
                            }}
                            className="mt-3 mx-auto flex items-center gap-1.5 text-[12.5px]"
                            style={{ color: T.textSecondary, fontWeight: 600, letterSpacing: '-0.01em' }}>
                      <Share2 size={13} strokeWidth={2.2} />
                      {shareToast || '친구에게 공유하기'}
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </ScreenFrame>
      );
    }

    function ActionButton({ side, expected, disabled, onPress }) {
      const [pressed, setPressed] = useState(false);
      const handlePress = (e) => {
        e.preventDefault();
        if (disabled) return;
        setPressed(true);
        setTimeout(() => setPressed(false), 80);
        onPress();
      };
      return (
        <button
          onPointerDown={handlePress}
          disabled={disabled}
          className="relative py-8 rounded-2xl flex items-center justify-center transition-all"
          style={{
            background: disabled ? '#E5E5E5' : (expected ? T.dark : '#1F1F1F'),
            color: disabled ? T.textMuted : '#fff',
            transform: pressed ? 'scale(0.96)' : 'scale(1)',
            transition: 'transform 0.08s ease, background 0.15s ease',
            boxShadow: !disabled && expected ? `0 0 0 3px ${T.lgRed}, 0 0 24px rgba(165,0,52,0.3)` : 'none',
            userSelect: 'none',
            WebkitUserSelect: 'none',
          }}
        >
          {side === 'left' ? (
            <ChevronLeft size={42} strokeWidth={3} color={disabled ? T.textMuted : '#fff'} />
          ) : (
            <ChevronRight size={42} strokeWidth={3} color={disabled ? T.textMuted : '#fff'} />
          )}
          <span className="absolute bottom-2 text-[10px]" style={{
            color: disabled ? T.textMuted : 'rgba(255,255,255,0.5)',
            fontWeight: 700, letterSpacing: '0.1em',
          }}>
            {side === 'left' ? 'LEFT (←)' : 'RIGHT (→)'}
          </span>
        </button>
      );
    }

    /* ─── Canvas: damaged laptop scene ─── */
    function drawScene(ctx, W, H, gauge, cracks, dents, sparks, lastTapTime, phase) {
      const damage = gauge / 100;
      ctx.clearRect(0, 0, W, H);

      // Background — clean, neutral with subtle vignette
      const bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H));
      bg.addColorStop(0, '#FAFAFA');
      bg.addColorStop(1, '#E5E5E5');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // Tap-time impact + ongoing instability
      const now = performance.now();
      const timeSinceTap = (now - lastTapTime) / 1000;
      const impactShake = Math.max(0, 1 - timeSinceTap * 8) * 4;
      const ambientShake = damage * damage * 3;
      const totalShake = impactShake + ambientShake;
      const shakeX = (Math.random() - 0.5) * totalShake;
      const shakeY = (Math.random() - 0.5) * totalShake;

      const cx = W/2 + shakeX;
      const cy = H/2 + shakeY;
      const lapW = Math.min(280, W * 0.72);
      const lapH = lapW * 0.7;

      drawLaptop(ctx, cx, cy, lapW, lapH, damage, cracks, dents);

      // Sparks (volatile)
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.15;
        s.life -= 1;
        const alpha = Math.max(0, s.life / s.maxLife);
        ctx.fillStyle = `rgba(255, ${100 + Math.random()*155}, 0, ${alpha})`;
        ctx.fillRect(cx + s.x, cy + s.y, 2, 2);
        if (s.life <= 0) sparks.splice(i, 1);
      }

      // High-damage smoke wisps
      if (damage > 0.7) {
        const smokeCount = Math.floor((damage - 0.7) * 8);
        ctx.fillStyle = `rgba(80, 80, 80, ${(damage - 0.7) * 0.4})`;
        for (let i = 0; i < smokeCount; i++) {
          const sx = cx + (Math.random() - 0.5) * lapW * 0.6;
          const sy = cy - lapH * 0.3 + Math.sin(now / 600 + i) * 20;
          const r = 8 + Math.random() * 12;
          ctx.beginPath();
          ctx.arc(sx, sy, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Floor reflection (subtle)
      ctx.fillStyle = 'rgba(0,0,0,0.05)';
      ctx.beginPath();
      ctx.ellipse(W/2, cy + lapH*0.6, lapW*0.5, 8, 0, 0, Math.PI*2);
      ctx.fill();
    }

    function drawLaptop(ctx, cx, cy, w, h, damage, cracks, dents) {
      const lx = cx - w/2;
      const ly = cy - h/2;
      const screenH = h * 0.78;
      const baseH = h * 0.12;

      // Drop shadow
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.beginPath();
      ctx.ellipse(cx, cy + h*0.55, w*0.5, 7, 0, 0, Math.PI*2);
      ctx.fill();

      ctx.save();

      // ─ LID (the screen frame) ─
      const lidGrad = ctx.createLinearGradient(0, ly, 0, ly + screenH);
      lidGrad.addColorStop(0, '#F4F4F5');
      lidGrad.addColorStop(0.4, '#E4E4E7');
      lidGrad.addColorStop(1, '#A1A1AA');
      ctx.fillStyle = lidGrad;
      ctx.beginPath();
      ctx.roundRect(lx, ly, w, screenH, 8);
      ctx.fill();
      ctx.strokeStyle = '#71717A';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // Top edge highlight
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(lx + 6, ly + 1);
      ctx.lineTo(lx + w - 6, ly + 1);
      ctx.stroke();

      // ─ Body dents ─
      for (const dent of dents) {
        const dx = lx + w/2 + dent.x * w;
        const dy = ly + screenH/2 + dent.y * screenH;
        if (dx < lx + 3 || dx > lx + w - 3 || dy < ly + 3 || dy > ly + screenH - 3) continue;
        ctx.save();
        ctx.translate(dx, dy);
        ctx.rotate(dent.angle);
        const dentGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, dent.size * w);
        dentGrad.addColorStop(0, 'rgba(0,0,0,0.35)');
        dentGrad.addColorStop(0.7, 'rgba(0,0,0,0.15)');
        dentGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = dentGrad;
        ctx.beginPath();
        ctx.ellipse(0, 0, dent.size * w, dent.size * w * 0.5, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }

      // ─ SCREEN inset ─
      const sPad = 10;
      const sx = lx + sPad;
      const sy = ly + sPad;
      const sw = w - sPad*2;
      const sh = screenH - sPad - 14;

      // Screen background
      ctx.fillStyle = '#0A0A0A';
      ctx.beginPath();
      ctx.roundRect(sx, sy, sw, sh, 3);
      ctx.fill();

      // Clip subsequent screen drawing
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(sx, sy, sw, sh, 3);
      ctx.clip();

      // LG logo (fades with damage)
      const logoVisibility = Math.max(0, 1 - damage * 1.3);
      if (logoVisibility > 0) {
        ctx.save();
        ctx.globalAlpha = logoVisibility;
        // Flicker at high damage
        if (damage > 0.3) {
          const flicker = Math.random() < damage * 0.5 ? 0.3 : 1;
          ctx.globalAlpha *= flicker;
        }
        ctx.fillStyle = T.lgRed;
        ctx.font = "bold 32px 'Pretendard Variable', sans-serif";
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        // Slight horizontal jitter
        const jitterX = damage > 0.2 ? (Math.random() - 0.5) * damage * 6 : 0;
        ctx.fillText('LG', sx + sw/2 + jitterX, sy + sh/2 - 4);
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font = "14px 'Pretendard Variable', sans-serif";
        ctx.fillText('gram', sx + sw/2 + jitterX, sy + sh/2 + 22);
        ctx.restore();
      }

      // Glitchy color pixels (volatile)
      if (damage > 0.15) {
        const pixelCount = Math.floor(damage * 120);
        const colors = ['#FF003C', '#00FF66', '#0066FF', '#FFFFFF', '#FF00FF', '#FFFF00'];
        for (let i = 0; i < pixelCount; i++) {
          const px = sx + Math.random() * sw;
          const py = sy + Math.random() * sh;
          ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
          const psize = 1 + Math.random() * 2;
          ctx.fillRect(px, py, psize, psize);
        }
      }

      // Horizontal scan-line glitches (volatile)
      if (damage > 0.3) {
        const lineCount = Math.floor((damage - 0.3) * 12);
        for (let i = 0; i < lineCount; i++) {
          const ly2 = sy + Math.random() * sh;
          const lh = 1 + Math.random() * 3;
          ctx.fillStyle = `rgba(255, 255, 255, ${0.2 + Math.random() * 0.3})`;
          ctx.fillRect(sx, ly2, sw, lh);
        }
      }

      // Color shift bands
      if (damage > 0.5) {
        const bandCount = Math.floor((damage - 0.5) * 6);
        for (let i = 0; i < bandCount; i++) {
          const by = sy + Math.random() * sh;
          const bh = 4 + Math.random() * 10;
          const colors = ['rgba(255,0,60,0.25)', 'rgba(0,255,255,0.25)', 'rgba(255,255,0,0.2)'];
          ctx.fillStyle = colors[Math.floor(Math.random()*colors.length)];
          ctx.fillRect(sx, by, sw, bh);
        }
      }

      // Black-out patches (heavy damage)
      if (damage > 0.7) {
        const blackouts = Math.floor((damage - 0.7) * 12);
        for (let i = 0; i < blackouts; i++) {
          const px = sx + Math.random() * sw;
          const py = sy + Math.random() * sh;
          const r = 4 + Math.random() * 18;
          ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
          ctx.beginPath();
          ctx.arc(px, py, r, 0, Math.PI*2);
          ctx.fill();
        }
      }

      // Cracks (stable, drawn through the clip)
      const visibleCracks = Math.floor(cracks.length);
      for (let i = 0; i < visibleCracks; i++) {
        const c = cracks[i];
        const ox = sx + sw/2 + c.startX * sw/2;
        const oy = sy + sh/2 + c.startY * sh/2;
        ctx.strokeStyle = `rgba(255,255,255,${c.intensity})`;
        ctx.lineWidth = 1.4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(ox, oy);
        for (const seg of c.segments) {
          ctx.lineTo(sx + sw/2 + seg.x * sw/2, sy + sh/2 + seg.y * sh/2);
        }
        ctx.stroke();
        // Shadow side of crack
        ctx.strokeStyle = `rgba(0,0,0,${c.intensity * 0.5})`;
        ctx.lineWidth = 0.6;
        ctx.stroke();
      }

      ctx.restore(); // end screen clip

      // Camera notch
      ctx.fillStyle = '#0A0A0A';
      ctx.beginPath();
      ctx.arc(lx + w/2, ly + 5, 1.5, 0, Math.PI*2);
      ctx.fill();

      // ─ BASE (bottom part / keyboard) ─
      const baseY = ly + screenH + 1;
      const baseGrad = ctx.createLinearGradient(0, baseY, 0, baseY + baseH);
      baseGrad.addColorStop(0, '#D4D4D8');
      baseGrad.addColorStop(1, '#9CA3AF');
      ctx.fillStyle = baseGrad;
      ctx.beginPath();
      ctx.moveTo(lx - 6, baseY + baseH);
      ctx.lineTo(lx + w + 6, baseY + baseH);
      ctx.lineTo(lx + w, baseY);
      ctx.lineTo(lx, baseY);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#71717A';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Base highlight strip
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillRect(lx, baseY, w, 1);

      // Crack the base at high damage
      if (damage > 0.6) {
        ctx.strokeStyle = `rgba(0,0,0,${(damage - 0.6) * 1.5})`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(lx + w * 0.3, baseY);
        ctx.lineTo(lx + w * 0.35, baseY + baseH);
        ctx.stroke();
        if (damage > 0.85) {
          ctx.beginPath();
          ctx.moveTo(lx + w * 0.7, baseY);
          ctx.lineTo(lx + w * 0.65, baseY + baseH);
          ctx.stroke();
        }
      }

      ctx.restore();
    }

    function AnalyticsScreen({ back, memberId, userData }) {
      const [events, setEvents] = useState([]);

      useEffect(() => {
        (async () => {
          const raw = await userStorage(memberId).get('events');
          setEvents(raw ? JSON.parse(raw) : []);
        })();
      }, [memberId]);

      const formatTs = (ts) => {
        if (!ts) return '—';
        const d = new Date(ts);
        const pad = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      };
      const relativeTime = (ts) => {
        if (!ts) return '—';
        const diff = Math.floor((Date.now() - ts) / 1000);
        if (diff < 5) return '방금 전';
        if (diff < 60) return `${diff}초 전`;
        if (diff < 3600) return `${Math.floor(diff/60)}분 전`;
        if (diff < 86400) return `${Math.floor(diff/3600)}시간 전`;
        return `${Math.floor(diff/86400)}일 전`;
      };

      const couponStateLabel = () => {
        if (userData?.couponStatus === 'used') return '사용 완료';
        if (userData?.couponStatus === 'unused') return '발급됨';
        return '미발급';
      };

      const handleCopy = async () => {
        try {
          const payload = {
            memberId,
            userData,
            events: events.slice().reverse(),
            exportedAt: Date.now(),
          };
          await navigator.clipboard.writeText(JSON.stringify(payload, null, 2));
          setCopied(true);
          setTimeout(() => setCopied(false), 1800);

      const recentEvents = [...events].reverse(); // 최신 먼저

                <StatRow label="최근 활동" value={relativeTime(userData?.lastActiveAt)} />
                <StatRow label="접속 횟수" value={`${userData?.sessionCount ?? 0}회`} accent />
                <StatRow label="게임 시도 횟수" value={`${userData?.gameAttempts ?? 0}회`} accent />
                <StatRow label="베스트 점수" value={`${(userData?.bestScore ?? 0).toLocaleString()} pt`} />
                <StatRow label="교환권 상태" value={couponStateLabel()} accent />
                <StatRow label="교환권 발급" value={userData?.couponIssuedAt ? formatTs(userData.couponIssuedAt) : '—'} mono />
                <StatRow label="교환권 사용" value={userData?.couponRedeemedAt ? formatTs(userData.couponRedeemedAt) : '—'} mono last />
              </div>

              <button onClick={handleCopy}
                      className="mt-3 w-full py-2.5 rounded-lg text-[12.5px] transition-all active:scale-[0.99]"
                      style={{ background: T.surface, color: T.textPrimary, border: `1px solid ${T.border}`, fontWeight: 600 }}>
                {copied ? '✓ 복사 완료' : 'JSON 복사 (전체 데이터 + 이벤트)'}
              </button>

              <div className="mt-7 flex items-baseline justify-between">
                <h2 style={{ fontSize: '20px', fontWeight: 800, color: T.textPrimary, letterSpacing: '-0.02em' }}>
                  최근 이벤트
                </h2>
                <span className="text-[11px]" style={{ color: T.textMuted, fontWeight: 600 }}>
                  최근 {events.length}건
                </span>
              </div>

              {recentEvents.length === 0 ? (
                <div className="mt-4 rounded-xl p-5 text-center text-[12px]"
                     style={{ background: T.surface, border: `1px solid ${T.border}`, color: T.textMuted }}>
                  아직 기록된 이벤트가 없어요
                </div>
              ) : (
                <div className="mt-4 space-y-1.5">
                  {recentEvents.map((e, i) => (
                    <EventRow key={i} event={e} formatTs={formatTs} />
                  ))}
                </div>
              )}

              <div className="mt-6 rounded-xl p-3.5" style={{ background: T.surfaceAlt, border: `1px solid ${T.borderSubtle}` }}>
                <div className="text-[11px] leading-relaxed" style={{ color: T.textMuted }}>
                  본 패널은 데모 환경에서 분석 레이어 구조를 검증하는 용도입니다. 실제 운영 시 GA4, Mixpanel, 또는 자체 백엔드로 동일 형태의 이벤트가 전송됩니다.
                </div>
              </div>
            </div>
          </div>
        </ScreenFrame>
      );
    }

    function StatRow({ label, value, accent, mono, last }) {
      return (
        <div className="flex items-center justify-between px-4 py-3"
             style={last ? {} : { borderBottom: `1px solid ${T.borderSubtle}` }}>
          <span style={{ color: T.textMuted, fontSize: '12px', fontWeight: 500 }}>{label}</span>
          <span style={{
            color: accent ? T.lgRed : T.textPrimary,
            fontSize: '13px',
            fontWeight: 700,
            letterSpacing: '-0.01em',
            fontFamily: mono ? 'ui-monospace, SFMono-Regular, Menlo, monospace' : 'inherit',
          }}>
            {value}
          </span>
        </div>
      );
    }

    function EventRow({ event, formatTs }) {
      const label = EVENT_LABELS[event.eventName] || event.eventName;
      const { eventName, timestamp, memberId, ...rest } = event;
      const propsStr = Object.keys(rest).length ? JSON.stringify(rest) : null;
      return (
        <div className="rounded-lg px-3.5 py-2.5"
             style={{ background: T.surface, border: `1px solid ${T.borderSubtle}` }}>
          <div className="flex items-center justify-between">
            <span style={{ fontSize: '12.5px', color: T.textPrimary, fontWeight: 700, letterSpacing: '-0.01em' }}>
              {label}
            </span>
            <span style={{ fontSize: '10.5px', color: T.textMuted, fontWeight: 500, fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace' }}>
              {formatTs(timestamp)}
            </span>
          </div>
          {propsStr && (
            <div className="mt-1" style={{ fontSize: '10.5px', color: T.textMuted, fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace', wordBreak: 'break-all' }}>
              {propsStr}
            </div>
          )}
        </div>
      );
    }

    function DetailRow({ label, value, last }) {
      return (
        <div className="flex justify-between items-center py-2.5" style={last ? {} : { borderBottom: `1px solid ${T.borderSubtle}` }}>
          <span style={{ color: T.textMuted, fontSize: '12px', fontWeight: 500 }}>{label}</span>
          <span style={{ color: T.textPrimary, fontSize: '13px', fontWeight: 600, letterSpacing: '-0.01em' }}>{value}</span>
        </div>
      );
    }

    /* ─── APP ─── */
    function App() {
      const [screen, setScreen] = useState('login');
      const [memberId, setMemberId] = useState(null);
      const [userData, setUserData] = useState(null);
      const [ready, setReady] = useState(false);

      // 파생값 — 기존 컴포넌트 prop 시그니처 유지
      const nickname = userData?.nickname ?? '';
      const bestScore = userData?.bestScore ?? 0;
      const couponStatus = userData?.couponStatus ?? 'none';

      // 회원번호 → 프로필 로드 (신규/기존 자동 판별)
      const loadProfile = async (mid, source) => {
        const us = userStorage(mid);
        let data = await us.get('data');
        const isNew = !data;
        if (isNew) {
          data = {
            nickname: generateNickname(),
            createdAt: Date.now(),
            lastActiveAt: Date.now(),
            sessionCount: 1,
            gameAttempts: 0,
            bestScore: 0,
            couponStatus: 'none',
            couponIssuedAt: null,
            couponRedeemedAt: null,
          };
        } else {
          data = JSON.parse(data);
          data.sessionCount = (data.sessionCount || 0) + 1;
          data.lastActiveAt = Date.now();
        }
        await us.set('data', JSON.stringify(data));
        // 회원번호를 먼저 세션에 노출시켜야 analytics.track()이 회원과 연결됨
        try { localStorage.setItem(CURRENT_MEMBER_KEY, mid); } catch {}
        setMemberId(mid);
        setUserData(data);
        // 이벤트 발동
        if (isNew) {
          analytics.track('login_new', { source });
        } else if (source === 'session_restore') {
          analytics.track('session_start');
        } else {
          analytics.track('login_existing');
        }
      };

      // 초기 로드 (세션 복원)
      useEffect(() => {
        (async () => {
          try {
            const savedMid = localStorage.getItem(CURRENT_MEMBER_KEY);
            if (savedMid) {
              await loadProfile(savedMid, 'session_restore');
              setScreen('intro');
            } else {
              setScreen('login');
            }
          } catch { setScreen('login'); }
          setReady(true);
        })();
      }, []);

      // 로그인 (LoginScreen에서 호출)
      const onLogin = async (mid, source) => {
        await loadProfile(mid, source);
        setScreen('intro');
      };

      // 로그아웃
      const onLogout = async () => {
        await analytics.track('logout');
        try { localStorage.removeItem(CURRENT_MEMBER_KEY); } catch {}
        setMemberId(null);
        setUserData(null);
        setScreen('login');
      };

      // 사용자 데이터 부분 업데이트 (lastActiveAt 자동 갱신)
      const updateUserData = async (partial) => {
        if (!memberId) return null;
        const updated = { ...userData, ...partial, lastActiveAt: Date.now() };
        setUserData(updated);
        await userStorage(memberId).set('data', JSON.stringify(updated));
        return updated;
      };

      // 인트로에서 화면 이동 (네비게이션 트래킹)
      const navigate = (target) => {
        if (target === 'game') {
          updateUserData({ gameAttempts: (userData?.gameAttempts ?? 0) + 1 });
          analytics.track('game_start', { attemptNo: (userData?.gameAttempts ?? 0) + 1 });
        } else if (target === 'coupon') analytics.track('view_coupon');
        else if (target === 'analytics') { /* 데모 패널 자체는 트래킹 안 함 */ }
        setScreen(target);
      };

      // 교환권 상태 저장 (트래킹 포함)
      const saveCouponStatus = async (status) => {
        if (!memberId) return;
        const patch = { couponStatus: status };
        if (status === 'used' && !userData?.couponRedeemedAt) {
          patch.couponRedeemedAt = Date.now();
        }
        await updateUserData(patch);
        // 트래킹은 호출처에서 처리 (CouponScreen이 더 적절)
      };

      // 게임 완료
      // 게임 완료
      const onGameComplete = async (finalScore, meta = {}) => {
        if (!memberId) return;
        const patch = {};
        const wasNewBest = finalScore > (userData?.bestScore ?? 0);
        if (wasNewBest) {
          patch.bestScore = finalScore;
        }
        const willIssueCoupon = (userData?.couponStatus ?? 'none') === 'none';
        if (willIssueCoupon) {
          patch.couponStatus = 'unused';
          patch.couponIssuedAt = Date.now();
        }
        await updateUserData(patch);
        analytics.track('game_complete', { score: finalScore, newBest: wasNewBest, ...meta });
        if (willIssueCoupon) analytics.track('coupon_issued');
        // 버튼 CTA "커피 교환하러 가기"에 맞춰 교환권 화면으로 자동 이동
        analytics.track('view_coupon');
        setScreen('coupon');
      };

      // 게임 중도 이탈
      const onGameAbandoned = async (meta = {}) => {
        analytics.track('game_abandoned', meta);
        setScreen('intro');
      };

      return (
        <div className="w-full h-screen flex items-center justify-center" style={{ background: '#0A0A0A' }}>
          <div className="gc-mobile-frame relative overflow-hidden">
            {ready && screen === 'login' && (
              <LoginScreen onLogin={onLogin} />
            )}
            {ready && screen === 'intro' && memberId && (
              <IntroScreen go={navigate} nickname={nickname} onLogout={onLogout} couponStatus={couponStatus} bestScore={bestScore} />
            )}
            {ready && screen === 'game' && memberId && (
              <GameScreen key="game-instance" onComplete={onGameComplete} onAbandoned={onGameAbandoned} bestScore={bestScore} />
            )}
            {ready && screen === 'coupon' && memberId && (
              <CouponScreen back={() => setScreen('intro')} couponStatus={couponStatus} setCouponStatus={saveCouponStatus} bestScore={bestScore} nickname={nickname} onPlayAgain={() => navigate('game')} />
            )}
            {ready && screen === 'analytics' && memberId && (
              <AnalyticsScreen back={() => setScreen('intro')} memberId={memberId} userData={userData} />
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
